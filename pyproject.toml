[project]
name = "culinarystate"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
step35 = ["rdkit==2026.3.6"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["ledgers: integration tests over the real local ledgers (slow; run with -m ledgers)"]
addopts = "-m 'not ledgers'"
